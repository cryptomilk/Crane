[workspace]
members = ["crane-core", "crane", "crane-serve", "example"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/lucasjinreal/Crane"
authors = ["Nicholas Jela<nicholasjela@gmail.com>"]

[workspace.dependencies]
# Pinned to a commit on the unmerged "Feat/rocm backend" branch (see
# https://github.com/huggingface/candle/pull/3801) to get ROCm/HIP support
# ahead of upstream merging it. Pinned to a commit, not the branch name,
# since the branch is actively force-pushed. See CONTAINER.md for context.
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
fst = "0.4"

# All four candle crates are patched to the same local fork so the `--features rocm`
# build resolves against its ROCm backend. They must all point at one fork checkout
# (same 0.11.0 workspace version) to avoid linking two incompatible candle-core copies.
# candle-onnx is patched here too, but its Crane `rocm` feature intentionally forwards
# nothing — the fork's candle-onnx has no `rocm` feature.
# Paths are relative to this file, assuming Crane and candle checkouts are siblings
# under the same parent directory.
[patch.crates-io]
candle-core = { git = "https://github.com/xmiksay/candle", rev = "8a17ca0a4c66b43d933b7e192db6860ee68f9c71" }
candle-nn = { git = "https://github.com/xmiksay/candle", rev = "8a17ca0a4c66b43d933b7e192db6860ee68f9c71" }
candle-transformers = { git = "https://github.com/xmiksay/candle", rev = "8a17ca0a4c66b43d933b7e192db6860ee68f9c71" }
